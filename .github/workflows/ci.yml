name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Syntax check pipeline scripts
        run: |
          python -m py_compile scripts/transcribe_video.py
          python -m py_compile scripts/create_viral_segments.py
          python -m py_compile scripts/cut_segments.py
          python -m py_compile scripts/compile_segments.py
          python -m py_compile scripts/adjust_subtitles.py
          python -m py_compile scripts/burn_subtitles.py
          python -m py_compile scripts/edit_video.py
          python -m py_compile webui/app.py
