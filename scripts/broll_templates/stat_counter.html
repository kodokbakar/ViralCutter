<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .sleek-badge {
    position: relative;
    width: 760px;
    background: rgba(13, 17, 23, 0.86);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px;
    padding: 28px 36px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.65),
      0 0 35px rgba(0, 240, 255, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    gap: 32px;
    opacity: 0;
    transform: translateY(-40px) scale(0.94);
    transform-origin: center top;
  }
  .metric-pod {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-right: 32px;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    flex-shrink: 0;
  }
  .tag-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .led-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00F0FF;
    box-shadow: 0 0 10px #00F0FF;
  }
  .number-box {
    font-size: 78px;
    font-weight: 850;
    line-height: 1.0;
    color: {{ACCENT_COLOR}};
    letter-spacing: -1.5px;
    text-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
  }
  .info-pod {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .label-text {
    font-size: 30px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.3;
    letter-spacing: -0.4px;
  }
  .sub-meta {
    font-size: 16px;
    font-weight: 500;
    color: #94A3B8;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sleek-badge" id="card">
    <div class="metric-pod">
      <div class="tag-label">
        <span class="led-dot"></span>
        <span>METRIC // EVIDENCE</span>
      </div>
      <div class="number-box" id="number">{{PREFIX}}0{{SUFFIX}}</div>
    </div>
    <div class="info-pod">
      <div class="label-text" id="label">{{LABEL}}</div>
      <div class="sub-meta">VERIFIED CLIP HIGHLIGHT</div>
    </div>
  </div>
</div>

<script>
  const targetNum = parseFloat("{{TARGET_NUMBER}}") || 0;
  const prefix = "{{PREFIX}}";
  const suffix = "{{SUFFIX}}";
  const card = document.getElementById('card');
  const numEl = document.getElementById('number');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${-40 * (1 - p)}px) scale(${0.94 + 0.06 * p})`;

      const current = Math.round(targetNum * Math.min(1, p));
      numEl.textContent = `${prefix}${current}${suffix}`;
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) scale(1)';
      numEl.textContent = `${prefix}${targetNum}${suffix}`;
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${-30 * p}px) scale(${1 - 0.04 * p})`;
      numEl.textContent = `${prefix}${targetNum}${suffix}`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
