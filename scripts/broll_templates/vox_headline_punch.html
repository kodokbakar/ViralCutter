<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: #0E1015;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Impact, "Arial Black", sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 70px;
    background-image: 
      radial-gradient(circle, rgba(255,255,255,0.06) 1.5px, transparent 1.5px),
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px, 90px 90px, 90px 90px;
  }
  /* Top Stamped Tag */
  .badge-tag {
    align-self: flex-start;
    background: #FF5A36;
    color: #FFFFFF;
    font-family: ui-monospace, monospace;
    font-size: 24px;
    font-weight: 900;
    padding: 10px 22px;
    border-radius: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 4px 4px 0 #000;
    margin-bottom: 50px;
    opacity: 0;
    transform: translateY(-20px);
  }
  /* Kinetic Headline Rows */
  .headline-row {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 110px;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: -1.5px;
    margin-bottom: 24px;
    opacity: 0;
    transform: scale(1.15) translateY(30px);
    transform-origin: left center;
  }
  .row-1 { color: #FAF7F2; }
  .row-2 {
    display: inline-block;
    background: #FFE600;
    color: #101216;
    padding: 4px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transform: rotate(-1deg);
  }
  .row-3 { color: #FF5A36; text-shadow: 0 4px 20px rgba(255,90,54,0.3); }

  /* Subtitle Explanation Bar */
  .subtext-bar {
    margin-top: 50px;
    border-left: 6px solid #FFE600;
    padding-left: 24px;
    font-size: 36px;
    font-weight: 700;
    color: #D1D5DB;
    line-height: 1.35;
    max-width: 900px;
    opacity: 0;
    transform: translateX(-30px);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="badge-tag" id="badgeTag">{{TAG}}</div>
  <div class="headline-row row-1" id="row1">{{LINE_1}}</div>
  <div><div class="headline-row row-2" id="row2">{{LINE_2}}</div></div>
  <div class="headline-row row-3" id="row3">{{LINE_3}}</div>
  <div class="subtext-bar" id="subtext">{{SUBTEXT}}</div>
</div>

<script>
  const badgeTag = document.getElementById('badgeTag');
  const r1 = document.getElementById('row1');
  const r2 = document.getElementById('row2');
  const r3 = document.getElementById('row3');
  const subtext = document.getElementById('subtext');

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function easeInBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return c3 * x * x * x - c1 * x * x;
  }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.10) {
      const p = easeOutBack(progress / 0.10);
      badgeTag.style.opacity = p;
      badgeTag.style.transform = `translateY(${-20 * (1 - p)}px)`;
      r1.style.opacity = 0; r2.style.opacity = 0; r3.style.opacity = 0; subtext.style.opacity = 0;
    } else if (progress < 0.20) {
      badgeTag.style.opacity = 1;
      const p = easeOutBack((progress - 0.10) / 0.10);
      r1.style.opacity = p;
      r1.style.transform = `scale(${1.15 - 0.15 * p}) translateY(${30 * (1 - p)}px)`;
      r2.style.opacity = 0; r3.style.opacity = 0; subtext.style.opacity = 0;
    } else if (progress < 0.32) {
      badgeTag.style.opacity = 1; r1.style.opacity = 1; r1.style.transform = 'scale(1) translateY(0)';
      const p = easeOutBack((progress - 0.20) / 0.12);
      r2.style.opacity = p;
      r2.style.transform = `scale(${1.15 - 0.15 * p}) translateY(${30 * (1 - p)}px) rotate(-1deg)`;
      r3.style.opacity = 0; subtext.style.opacity = 0;
    } else if (progress < 0.44) {
      badgeTag.style.opacity = 1; r1.style.opacity = 1; r2.style.opacity = 1; r2.style.transform = 'scale(1) translateY(0) rotate(-1deg)';
      const p = easeOutBack((progress - 0.32) / 0.12);
      r3.style.opacity = p;
      r3.style.transform = `scale(${1.15 - 0.15 * p}) translateY(${30 * (1 - p)}px)`;
      const sp = Math.min(1, p);
      subtext.style.opacity = sp;
      subtext.style.transform = `translateX(${-30 * (1 - sp)}px)`;
    } else if (progress <= 0.84) {
      badgeTag.style.opacity = 1;
      r1.style.opacity = 1; r1.style.transform = 'scale(1) translateY(0)';
      r2.style.opacity = 1; r2.style.transform = 'scale(1) translateY(0) rotate(-1deg)';
      r3.style.opacity = 1; r3.style.transform = 'scale(1) translateY(0)';
      subtext.style.opacity = 1; subtext.style.transform = 'translateX(0)';
    } else {
      const p = easeInBack((progress - 0.84) / 0.16);
      badgeTag.style.opacity = Math.max(0, 1 - p * 1.5);
      r1.style.opacity = Math.max(0, 1 - p * 1.5);
      r1.style.transform = `translateY(${-60 * p}px)`;
      r2.style.opacity = Math.max(0, 1 - p * 1.5);
      r2.style.transform = `translateY(${-60 * p}px) rotate(-1deg)`;
      r3.style.opacity = Math.max(0, 1 - p * 1.5);
      r3.style.transform = `translateY(${-60 * p}px)`;
      subtext.style.opacity = Math.max(0, 1 - p * 1.5);
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
