<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 310px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Apple Dynamic Island Style Capsule */
  .dynamic-island {
    position: relative;
    width: 780px;
    background: rgba(13, 17, 23, 0.90);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px;
    padding: 24px 34px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.7),
      0 0 35px rgba(245, 158, 11, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: scale(0.92) translateY(-30px);
    transform-origin: center top;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tag-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 9999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #F59E0B;
    text-transform: uppercase;
  }
  .led-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #F59E0B;
    box-shadow: 0 0 8px #F59E0B;
  }
  .meta-sub {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 1px;
  }
  .headline-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
  }
  .text-part-1 {
    font-size: 34px;
    font-weight: 850;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }
  .text-part-2 {
    font-size: 34px;
    font-weight: 850;
    color: #F59E0B;
    background: rgba(245, 158, 11, 0.14);
    border: 1px solid rgba(245, 158, 11, 0.3);
    padding: 2px 10px;
    border-radius: 8px;
    letter-spacing: -0.5px;
  }
  .text-part-3 {
    font-size: 34px;
    font-weight: 850;
    color: #38BDF8;
    letter-spacing: -0.5px;
  }
  .subtext {
    font-size: 18px;
    font-weight: 500;
    color: #94A3B8;
    line-height: 1.35;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="dynamic-island" id="card">
    <div class="top-row">
      <div class="tag-pill">
        <span class="led-pulse"></span>
        <span>{{TAG}}</span>
      </div>
      <span class="meta-sub">KEY INSIGHT</span>
    </div>
    <div class="headline-wrap">
      <span class="text-part-1">{{LINE_1}}</span>
      <span class="text-part-2">{{LINE_2}}</span>
      <span class="text-part-3">{{LINE_3}}</span>
    </div>
    <div class="subtext" id="subtext">{{SUBTEXT}}</div>
  </div>
</div>

<script>
  const card = document.getElementById('card');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `scale(${0.92 + 0.08 * p}) translateY(${-30 * (1 - p)}px)`;
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'scale(1) translateY(0)';
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `scale(${1 - 0.04 * p}) translateY(${-25 * p}px)`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
