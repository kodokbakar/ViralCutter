<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 60px;
  }
  .vox-paper-card {
    position: relative;
    width: 940px;
    background: #FAF7F2; /* Warm Editorial Newsprint */
    color: #121316;
    border: 3px solid #121316;
    border-radius: 8px;
    padding: 70px 70px 60px 70px;
    box-shadow: 
      0 32px 64px rgba(0, 0, 0, 0.85),
      0 10px 20px rgba(0, 0, 0, 0.4);
    transform-origin: center center;
    opacity: 0;
    transform: translateY(90px) rotate(1.2deg);
  }
  /* Kraft Paper Tape at Top Center */
  .kraft-tape {
    position: absolute;
    top: -24px; left: 50%;
    transform: translateX(-50%) rotate(-1deg);
    width: 220px; height: 46px;
    background: #DEC9A5;
    opacity: 0.95;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    clip-path: polygon(3% 0%, 97% 2%, 100% 96%, 96% 100%, 0% 98%);
  }
  /* Category Pill */
  .card-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #121316;
    padding-bottom: 18px;
    margin-bottom: 30px;
    font-family: ui-monospace, monospace;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .quote-pill {
    background: #0B132B;
    color: #FFE600;
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 16px;
  }
  /* Giant Quotation Mark */
  .quote-mark {
    font-family: Georgia, serif;
    font-size: 110px;
    line-height: 0.7;
    color: #FF5A36;
    margin-bottom: 12px;
    user-select: none;
  }
  /* Quote Body with Highlighter Marker Sweep */
  .quote-body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 44px;
    font-weight: 850;
    line-height: 1.35;
    color: #121316;
    letter-spacing: -0.8px;
    margin-bottom: 36px;
  }
  .highlight-sweep {
    background: linear-gradient(to right, #FFE600 0%, #FFE600 100%);
    background-repeat: no-repeat;
    background-size: 0% 100%;
    padding: 2px 8px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    transition: none;
  }
  /* Speaker Stamp Footer */
  .speaker-footer {
    display: flex;
    align-items: center;
    border-top: 2px dashed rgba(18, 19, 22, 0.3);
    padding-top: 24px;
  }
  .stamp-avatar {
    width: 60px; height: 60px;
    border: 2px solid #121316;
    background: #FF5A36;
    color: #FFFFFF;
    font-family: ui-monospace, monospace;
    font-weight: 900;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    margin-right: 20px;
    box-shadow: 2px 3px 0 #121316;
  }
  .speaker-details {
    display: flex;
    flex-direction: column;
  }
  .speaker-name {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: #121316;
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }
  .speaker-title {
    font-family: ui-monospace, monospace;
    font-size: 20px;
    color: #4B5563;
    margin-top: 2px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="vox-paper-card" id="card">
    <div class="kraft-tape"></div>
    <div class="card-top-bar">
      <span class="quote-pill">PULL-QUOTE // STATEMENT</span>
      <span>VOX ARCHIVE</span>
    </div>
    <div class="quote-mark">“</div>
    <div class="quote-body">
      <span class="highlight-sweep" id="highlight">{{QUOTE}}</span>
    </div>
    <div class="speaker-footer">
      <div class="stamp-avatar">VOX</div>
      <div class="speaker-details">
        <div class="speaker-name">{{AUTHOR}}</div>
        <div class="speaker-title">{{TITLE}}</div>
      </div>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');
  const highlight = document.getElementById('highlight');

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function easeInBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return c3 * x * x * x - c1 * x * x;
  }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = easeOutBack(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${90 * (1 - p)}px) rotate(${1.2 * p}deg)`;
      highlight.style.backgroundSize = '0% 100%';
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) rotate(1.2deg)';

      // Marker highlighter wipes across the text between 0.16 and 0.40
      const sweepProgress = Math.min(1, Math.max(0, (progress - 0.16) / 0.24));
      highlight.style.backgroundSize = `${Math.round(sweepProgress * 100)}% 100%`;
    } else {
      const p = easeInBack((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${110 * p}px) rotate(${1.2 + 2 * p}deg)`;
      highlight.style.backgroundSize = '100% 100%';
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
