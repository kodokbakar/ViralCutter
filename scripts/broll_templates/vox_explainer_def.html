<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Sleek Glass Definition Card */
  .sleek-def {
    position: relative;
    width: 780px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 26px;
    padding: 28px 36px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.65),
      0 0 30px rgba(56, 189, 248, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(-35px) scale(0.95);
    transform-origin: center top;
  }
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .def-tag {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #38BDF8;
    text-transform: uppercase;
  }
  .term-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 10px;
  }
  .term-title {
    font-size: 38px;
    font-weight: 850;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }
  .phonetic {
    font-family: Georgia, serif;
    font-size: 18px;
    font-style: italic;
    color: #94A3B8;
  }
  .pos-tag {
    font-size: 13px;
    font-weight: 700;
    color: #38BDF8;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .def-body {
    font-size: 24px;
    font-weight: 600;
    color: #E2E8F0;
    line-height: 1.35;
    margin-bottom: 12px;
  }
  .context-callout {
    font-size: 15px;
    font-weight: 500;
    color: #94A3B8;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 10px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sleek-def" id="card">
    <div class="top-meta">
      <span class="def-tag">EXPLAINER // DEFINITION</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.4); font-family: monospace;">GLOSSARY</span>
    </div>
    <div class="term-row">
      <span class="term-title">{{TERM}}</span>
      <span class="phonetic">{{PHONETIC}}</span>
      <span class="pos-tag">{{POS}}</span>
    </div>
    <div class="def-body">{{DEFINITION}}</div>
    <div class="context-callout">{{CONTEXT_NOTE}}</div>
  </div>
</div>

<script>
  const card = document.getElementById('card');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${-35 * (1 - p)}px) scale(${0.95 + 0.05 * p})`;
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) scale(1)';
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${-25 * p}px) scale(${1 - 0.04 * p})`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
