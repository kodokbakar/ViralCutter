<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 60px;
  }
  .def-card {
    position: relative;
    width: 950px;
    background: #FAF7F2;
    border: 4px solid #121316;
    border-radius: 12px;
    padding: 70px 65px;
    box-shadow: 
      0 32px 64px rgba(0, 0, 0, 0.85),
      6px 8px 0 #121316;
    opacity: 0;
    transform: translateY(80px) rotate(-0.5deg);
  }
  /* Top Blueprint Header */
  .def-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #121316;
    padding-bottom: 20px;
    margin-bottom: 32px;
    font-family: ui-monospace, monospace;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #121316;
  }
  .term-tag {
    background: #0B132B;
    color: #FFE600;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 16px;
  }
  /* Term and Pronunciation */
  .term-title {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 80px;
    line-height: 1.05;
    color: #121316;
    text-transform: uppercase;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .phonetic-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }
  .phonetic {
    font-family: Georgia, serif;
    font-size: 28px;
    font-style: italic;
    color: #4B5563;
  }
  .part-of-speech {
    background: #E5E7EB;
    color: #1F2937;
    font-family: ui-monospace, monospace;
    font-size: 18px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid #9CA3AF;
  }
  /* Definition Body with Highlighter Marker Sweep */
  .def-body {
    font-size: 38px;
    font-weight: 750;
    line-height: 1.4;
    color: #1F2937;
    margin-bottom: 40px;
  }
  .highlight-sweep {
    background: linear-gradient(to right, #FFE600 0%, #FFE600 100%);
    background-repeat: no-repeat;
    background-size: 0% 100%;
    padding: 2px 6px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  /* Bottom Example Callout Box */
  .callout-box {
    background: #121316;
    color: #FAF7F2;
    border-radius: 8px;
    padding: 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .callout-label {
    font-family: ui-monospace, monospace;
    font-size: 16px;
    font-weight: 800;
    color: #FF5A36;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .callout-text {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.35;
    color: #F3F4F6;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="def-card" id="card">
    <div class="def-header">
      <span class="term-tag">EXPLAINER // DEFINITION</span>
      <span>INDEX REF +</span>
    </div>
    <div class="term-title">{{TERM}}</div>
    <div class="phonetic-row">
      <span class="phonetic">{{PHONETIC}}</span>
      <span class="part-of-speech">{{POS}}</span>
    </div>
    <div class="def-body">
      <span class="highlight-sweep" id="highlight">{{DEFINITION}}</span>
    </div>
    <div class="callout-box">
      <span class="callout-label">CONTEXT NOTE</span>
      <span class="callout-text">{{CONTEXT_NOTE}}</span>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');
  const highlight = document.getElementById('highlight');

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function easeInBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return c3 * x * x * x - c1 * x * x;
  }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = easeOutBack(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${80 * (1 - p)}px) rotate(${-0.5 * p}deg)`;
      highlight.style.backgroundSize = '0% 100%';
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) rotate(-0.5deg)';

      const sweep = Math.min(1, Math.max(0, (progress - 0.16) / 0.26));
      highlight.style.backgroundSize = `${Math.round(sweep * 100)}% 100%`;
    } else {
      const p = easeInBack((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${100 * p}px) rotate(${-0.5 - 2 * p}deg)`;
      highlight.style.backgroundSize = '100% 100%';
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
