<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .board-container {
    width: 780px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  /* Sleek Headline Pill */
  .headline-pill {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 9999px;
    padding: 10px 22px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1.0px;
    color: #F8FAFC;
    text-transform: uppercase;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    opacity: 0;
    transform: translateY(-20px);
  }
  .headline-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3B82F6;
    box-shadow: 0 0 10px #3B82F6;
  }
  /* Steps List */
  .points-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .point-card {
    background: rgba(18, 24, 38, 0.86);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 
      0 12px 30px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
    opacity: 0;
    transform: translateY(-20px);
  }
  .badge-number {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }
  .point-text {
    font-size: 26px;
    font-weight: 700;
    color: #F1F5F9;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="board-container">
    <div class="headline-pill" id="headline">
      <span class="headline-dot"></span>
      <span>{{HEADLINE}}</span>
    </div>
    <div class="points-list" id="points-container">
      {{POINTS_HTML}}
    </div>
  </div>
</div>

<script>
  const headline = document.getElementById('headline');
  const cards = document.querySelectorAll('.point-card');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.14) {
      const p = spring(progress / 0.14);
      headline.style.opacity = Math.min(1, p * 1.3);
      headline.style.transform = `translateY(${-20 * (1 - p)}px)`;
      cards.forEach(c => { c.style.opacity = 0; });
    } else if (progress <= 0.84) {
      headline.style.opacity = 1;
      headline.style.transform = 'translateY(0)';

      // Staggered smooth slide down
      cards.forEach((c, idx) => {
        const start = 0.14 + (idx * 0.12);
        if (progress >= start) {
          const p = spring(Math.min(1, (progress - start) / 0.12));
          c.style.opacity = Math.min(1, p * 1.3);
          c.style.transform = `translateY(${-20 * (1 - p)}px)`;
        } else {
          c.style.opacity = 0;
          c.style.transform = 'translateY(-20px)';
        }
      });
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      headline.style.opacity = Math.max(0, 1 - p * 1.4);
      headline.style.transform = `translateY(${-25 * p}px)`;
      cards.forEach((c) => {
        c.style.opacity = Math.max(0, 1 - p * 1.4);
        c.style.transform = `translateY(${-25 * p}px)`;
      });
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
