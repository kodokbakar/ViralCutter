<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 60px;
  }
  .board-container {
    width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Tape Header Headline */
  .headline-tape {
    background: #FFE600;
    color: #121316;
    border: 3px solid #121316;
    padding: 16px 36px;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 46px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transform: rotate(-1.5deg);
    box-shadow: 0 16px 32px rgba(0,0,0,0.6);
    margin-bottom: 36px;
    opacity: 0;
    transform-origin: center center;
  }
  /* List of Sticky Paper Cards */
  .points-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .point-card {
    position: relative;
    background: #FAF7F2;
    border: 3px solid #121316;
    border-radius: 6px;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    box-shadow: 
      0 20px 40px rgba(0, 0, 0, 0.75),
      4px 4px 0 #121316;
    opacity: 0;
    transform-origin: left center;
  }
  .point-card:nth-child(1) { transform: translateX(-40px) rotate(-1deg); }
  .point-card:nth-child(2) { transform: translateX(-40px) rotate(1deg); }
  .point-card:nth-child(3) { transform: translateX(-40px) rotate(-0.5deg); }

  .badge-number {
    width: 58px; height: 58px;
    background: #FF5A36;
    color: #FFFFFF;
    border: 2px solid #121316;
    border-radius: 50%;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    margin-right: 24px;
    flex-shrink: 0;
    box-shadow: 2px 3px 0 #121316;
  }
  .point-text {
    font-size: 36px;
    font-weight: 800;
    color: #121316;
    line-height: 1.3;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="board-container">
    <div class="headline-tape" id="headline">{{HEADLINE}}</div>
    <div class="points-list" id="points-container">
      {{POINTS_HTML}}
    </div>
  </div>
</div>

<script>
  const headline = document.getElementById('headline');
  const cards = document.querySelectorAll('.point-card');

  function easeOutBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function easeInBack(x) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return c3 * x * x * x - c1 * x * x;
  }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    // Entry 0.00 to 0.40
    if (progress < 0.14) {
      const p = easeOutBack(progress / 0.14);
      headline.style.opacity = Math.min(1, p * 1.3);
      headline.style.transform = `translateY(${50 * (1 - p)}px) rotate(${-1.5 * p}deg)`;
      cards.forEach(c => { c.style.opacity = 0; });
    } else if (progress <= 0.84) {
      headline.style.opacity = 1;
      headline.style.transform = 'translateY(0) rotate(-1.5deg)';

      // Staggered cards entry: Card 1 (0.14-0.28), Card 2 (0.28-0.42), Card 3 (0.42-0.56)
      const baseRotations = [-1, 1, -0.5];
      cards.forEach((c, idx) => {
        const start = 0.14 + (idx * 0.13);
        const rot = baseRotations[idx % baseRotations.length];
        if (progress >= start) {
          const p = easeOutBack(Math.min(1, (progress - start) / 0.13));
          c.style.opacity = Math.min(1, p * 1.2);
          c.style.transform = `translateX(${40 * (1 - p)}px) rotate(${rot}deg)`;
        } else {
          c.style.opacity = 0;
          c.style.transform = `translateX(-40px) rotate(${rot}deg)`;
        }
      });
    } else {
      // Exit 0.84 to 1.00
      const p = easeInBack((progress - 0.84) / 0.16);
      headline.style.opacity = Math.max(0, 1 - p * 1.3);
      headline.style.transform = `translateY(${-60 * p}px) rotate(-1.5deg)`;
      cards.forEach((c, idx) => {
        c.style.opacity = Math.max(0, 1 - p * 1.4);
        c.style.transform = `translateY(${80 * p}px)`;
      });
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
