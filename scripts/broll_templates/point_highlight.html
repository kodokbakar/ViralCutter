<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .container {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 80px;
  }
  .card {
    background: rgba(18, 18, 22, 0.90);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 36px;
    padding: 60px 70px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(20px);
    width: 920px;
    opacity: 0;
    transform: translateY(60px);
  }
  .headline {
    font-size: 44px;
    font-weight: 800;
    color: #60A5FA;
    margin-bottom: 36px;
    border-bottom: 2px solid rgba(96, 165, 250, 0.3);
    padding-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .point-item {
    font-size: 34px;
    font-weight: 700;
    color: #F3F4F6;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    opacity: 0;
    transform: translateX(-30px);
  }
  .point-badge {
    background: #3B82F6;
    color: white;
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    margin-right: 20px; flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="card" id="card">
    <div class="headline">{{HEADLINE}}</div>
    <div id="points-container">
      {{POINTS_HTML}}
    </div>
  </div>
</div>
<script>
  const card = document.getElementById('card');
  const pointItems = document.querySelectorAll('.point-item');

  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));
    if (progress < 0.15) {
      const p = easeOutCubic(progress / 0.15);
      card.style.opacity = p;
      card.style.transform = `translateY(${60 * (1 - p)}px)`;
    } else if (progress <= 0.85) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0)';
      const activeWindow = 0.85 - 0.15;
      pointItems.forEach((el, idx) => {
        const itemStart = 0.15 + (idx * 0.12);
        if (progress >= itemStart) {
          const itemP = Math.min(1, (progress - itemStart) / 0.10);
          el.style.opacity = itemP;
          el.style.transform = `translateX(${-30 * (1 - itemP)}px)`;
        } else {
          el.style.opacity = 0;
          el.style.transform = 'translateX(-30px)';
        }
      });
    } else {
      const p = easeInCubic((progress - 0.85) / 0.15);
      card.style.opacity = 1 - p;
      card.style.transform = `translateY(${-40 * p}px)`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
