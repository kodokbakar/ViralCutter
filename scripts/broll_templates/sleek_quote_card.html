<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Sleek Glass Quote Card */
  .sleek-card {
    position: relative;
    width: 780px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 26px;
    padding: 30px 36px 30px 42px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.7),
      0 0 35px rgba(59, 130, 246, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(-40px) scale(0.95);
    transform-origin: center top;
  }
  /* Left Accent Glowing Line */
  .accent-line {
    position: absolute;
    left: 18px;
    top: 28px;
    bottom: 28px;
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #3B82F6 0%, #10B981 100%);
    box-shadow: 0 0 12px #3B82F6;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .quote-body {
    font-size: 32px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.35;
    letter-spacing: -0.3px;
    margin-bottom: 18px;
  }
  .author-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .author-name {
    font-size: 18px;
    font-weight: 700;
    color: #F8FAFC;
    letter-spacing: 0.2px;
  }
  .author-sep {
    color: rgba(255, 255, 255, 0.3);
    font-size: 14px;
  }
  .author-title {
    font-size: 15px;
    font-weight: 500;
    color: #94A3B8;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sleek-card" id="card">
    <div class="accent-line"></div>
    <div class="header-meta">
      <span>PULL-QUOTE // STATEMENT</span>
    </div>
    <div class="quote-body">"{{QUOTE}}"</div>
    <div class="author-row">
      <div class="author-name">{{AUTHOR}}</div>
      <span class="author-sep">•</span>
      <div class="author-title">{{TITLE}}</div>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${-40 * (1 - p)}px) scale(${0.95 + 0.05 * p})`;
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) scale(1)';
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${-30 * p}px) scale(${1 - 0.04 * p})`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
