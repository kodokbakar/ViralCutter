<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Sleek Glass Chart Card */
  .chart-card {
    position: relative;
    width: 780px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 26px;
    padding: 24px 34px 20px 34px;
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.65),
      0 0 30px rgba(16, 185, 129, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
    opacity: 0;
    transform: translateY(-35px) scale(0.95);
    transform-origin: center top;
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .chart-tag {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #10B981;
    text-transform: uppercase;
  }
  .chart-title {
    font-size: 26px;
    font-weight: 850;
    color: #FFFFFF;
    letter-spacing: -0.4px;
    margin-bottom: 20px;
  }
  .bars-container {
    height: 180px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 28px;
    padding: 10px 16px 0 16px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.12);
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .bar-value {
    font-size: 20px;
    font-weight: 800;
    color: #94A3B8;
    margin-bottom: 8px;
    opacity: 0;
  }
  .bar-pillar {
    width: 100%;
    max-width: 90px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 8px 8px 0 0;
    height: 0%;
  }
  .bar-col.accent .bar-pillar {
    background: linear-gradient(180deg, #10B981 0%, #059669 100%);
    box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
  }
  .bar-col.accent .bar-value {
    color: #10B981;
  }
  .bar-label {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    color: #E2E8F0;
  }
  .chart-footer {
    margin-top: 14px;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.4);
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="chart-card" id="card">
    <div class="chart-header">
      <span class="chart-tag">DATA COMPARISON</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.4); font-family: monospace;">CHART</span>
    </div>
    <div class="chart-title">{{CHART_TITLE}}</div>
    
    <div class="bars-container">
      {{BARS_HTML}}
    </div>

    <div class="chart-footer">
      <span>SOURCE: {{SOURCE}}</span>
      <span>+ [VERIFIED]</span>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');
  const pillars = document.querySelectorAll('.bar-pillar');
  const values = document.querySelectorAll('.bar-value');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${-35 * (1 - p)}px) scale(${0.95 + 0.05 * p})`;
      pillars.forEach(bar => { bar.style.height = '0%'; });
      values.forEach(v => { v.style.opacity = 0; });
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) scale(1)';

      const growProgress = spring(Math.min(1, Math.max(0, (progress - 0.16) / 0.28)));
      pillars.forEach(bar => {
        const targetH = parseFloat(bar.getAttribute('data-target-height')) || 50;
        bar.style.height = `${Math.round(targetH * growProgress)}%`;
      });
      values.forEach(v => {
        v.style.opacity = growProgress;
      });
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${-25 * p}px) scale(${1 - 0.04 * p})`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
