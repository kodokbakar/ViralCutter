<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    width: 100%; height: 100%;
    position: relative;
    padding-top: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* Sleek Comparison Dual Capsule */
  .versus-container {
    position: relative;
    width: 800px;
    display: flex;
    gap: 16px;
    opacity: 0;
    transform: translateY(-35px) scale(0.95);
    transform-origin: center top;
  }
  .side-card {
    flex: 1;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 24px;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
    position: relative;
  }
  .side-card.side-a {
    border-top: 3px solid #EF4444;
  }
  .side-card.side-b {
    border-top: 3px solid #10B981;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 25px rgba(16, 185, 129, 0.15);
  }
  .side-tag {
    font-family: ui-monospace, monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .side-a .side-tag { color: #EF4444; }
  .side-b .side-tag { color: #10B981; }

  .side-title {
    font-size: 28px;
    font-weight: 850;
    color: #FFFFFF;
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .side-desc {
    font-size: 16px;
    font-weight: 500;
    color: #94A3B8;
    line-height: 1.35;
  }
  /* Central Glowing VS Badge */
  .vs-badge-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .vs-badge {
    width: 52px; height: 52px;
    background: #0F172A;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: #F8FAFC;
    box-shadow: 0 8px 20px rgba(0,0,0,0.8), 0 0 15px rgba(59, 130, 246, 0.4);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="versus-container" id="card">
    <div class="side-card side-a">
      <div class="side-tag">{{TAG_A}}</div>
      <div class="side-title">{{TITLE_A}}</div>
      <div class="side-desc">{{DESC_A}}</div>
    </div>

    <div class="vs-badge-wrap">
      <div class="vs-badge">VS</div>
    </div>

    <div class="side-card side-b">
      <div class="side-tag">{{TAG_B}}</div>
      <div class="side-title">{{TITLE_B}}</div>
      <div class="side-desc">{{DESC_B}}</div>
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');

  function spring(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.exp(-7.0 * t) * Math.cos(9.0 * t);
  }
  function easeIn(t) { return t * t * t; }

  window.renderSeek = function(progress) {
    progress = Math.max(0, Math.min(1, progress));

    if (progress < 0.16) {
      const p = spring(progress / 0.16);
      card.style.opacity = Math.min(1, p * 1.3);
      card.style.transform = `translateY(${-35 * (1 - p)}px) scale(${0.95 + 0.05 * p})`;
    } else if (progress <= 0.84) {
      card.style.opacity = 1;
      card.style.transform = 'translateY(0) scale(1)';
    } else {
      const p = easeIn((progress - 0.84) / 0.16);
      card.style.opacity = Math.max(0, 1 - p * 1.4);
      card.style.transform = `translateY(${-25 * p}px) scale(${1 - 0.04 * p})`;
    }
  };
  window.renderSeek(0);
</script>
</body>
</html>
